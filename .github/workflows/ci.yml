name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.24"
      - name: gofmt
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            echo "these files are not gofmt-formatted:"
            echo "$unformatted"
            exit 1
          fi
      - name: vet
        run: go vet ./...
      - name: test
        run: go test ./... -cover
      - name: self-check on a healthy configuration
        run: |
          go run ./cmd/rulefit check \
            --config testdata/fixture-repo/.rulefit.json \
            --root testdata/fixture-repo
      - name: the defects fixture must still fail
        run: |
          if go run ./cmd/rulefit check \
              --config testdata/fixture-defects/.rulefit.json \
              --root testdata/fixture-defects; then
            echo "the defects fixture was expected to fail the run"
            exit 1
          fi
